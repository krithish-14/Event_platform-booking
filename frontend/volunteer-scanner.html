		<title>Volunteer Check-in | JOD Events</title>

		<link rel="apple-touch-icon" href="https://assets.jodevents.com/images/JOD Logo.png" />

	<body class="vol-body">
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PFZVZGJR"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

		<div class="vol-shell">
			<div class="vol-top">
				<button type="button" class="header-back-btn header-back-btn--on-dark" data-header-back data-back-fallback="/volunteer-portal" aria-label="Go back">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
					<span>Back</span>
				</button>
				<a class="vol-brand" id="brandLink" href="/volunteer-portal">Volunteer Check-in</a>
				<div class="vol-top-actions">
					<a class="vol-ghost" id="portalLink" href="/volunteer-portal">Portal</a>
				</div>
			</div>

			<!-- ── Assignment header ─────────────────────────────────── -->
			<div class="vol-card" id="scannerHeader">
				<div class="vol-kicker" id="roleLabel">Scanner Volunteer</div>
				<h1 class="vol-title" id="eventTitle">Loading event…</h1>
				<p class="vol-sub" id="scannerStatus">Starting camera…</p>
			</div>

			<!-- ── Live camera view ───────────────────────────────────── -->
			<div class="vol-camera-card" id="cameraCard">
				<div class="vol-camera is-open" id="cameraWrap">
					<video id="scannerVideo" playsinline muted autoplay></video>
					<div class="vol-frame"><span></span></div>
					<div class="vol-cam-hint" id="camHint">Point camera at a QR code</div>
					<!-- scanning pulse ring -->
					<div class="vol-scan-ring" id="scanRing"></div>
				</div>
				<p class="vol-error" id="cameraFallback" style="display:none;margin-top:0.8rem;">
					Camera unavailable. Enter the booking ID below.
				</p>
			</div>

			<!-- ── Result overlay (shown after each scan) ─────────────── -->
			<div class="vol-result-card" id="resultCard" style="display:none;">
				<div class="vol-result is-visible" id="scanResult"></div>
				<div class="vol-actions" style="margin-top:1rem;">
					<button type="button" class="vol-btn vol-btn-primary" id="btnBackToScanner">
						⬅ Scan Next Ticket
					</button>
				</div>
			</div>

			<!-- ── Manual entry (always visible below) ───────────────── -->
			<div class="vol-card" style="margin-top:0.8rem;">
				<p class="vol-sub" style="margin-bottom:0.6rem;font-weight:700;color:#e2e8f0;">Or enter booking ID</p>
				<input class="vol-input" id="ticketCodeInput" type="text" autocomplete="off"
					autocapitalize="characters" placeholder="#JOD-XXXXXXXX" />
				<div class="vol-actions">
					<button type="button" class="vol-btn vol-btn-primary" id="btnVerifyCode">Verify Ticket</button>
				</div>
			</div>

			<!-- ── Stats bar ─────────────────────────────────────────── -->
			<div class="vol-card" style="margin-top:0.8rem;">
				<div class="vol-stat">
					<span>Today's Check-ins</span>
					<strong id="todayCount">0</strong>
				</div>
			</div>
		</div>

		<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
		<script src="js/health.js?v=2"></script>
		<script src="js/volunteer-common.js?v=5"></script>
		<script src="js/volunteer-scanner.js?v=6"></script>
	</body>
</html>
