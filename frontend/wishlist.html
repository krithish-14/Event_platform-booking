<!doctype html>
<html lang="en">
<head>
		<script src="js/theme.js?v=6"></script>
		<script src="js/api-config.js?v=3"></script>
<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="description" content="Your saved events and wishlist on JOD Events." />
	<title>Your Wishlist | JOD Events</title>
	<link rel="icon" type="image/png" href="https://assets.jodevents.com/images/JOD Logo.png" />
	<link rel="apple-touch-icon" href="https://assets.jodevents.com/images/JOD Logo.png" />
	<link rel="stylesheet" href="css/style.css?v=24" />
	<link rel="stylesheet" href="css/responsive.css?v=20" />
	<style>
		.page-hero {
			background: linear-gradient(135deg, var(--dark) 0%, var(--dark-soft) 60%, #3d2a14 100%);
			padding: 4.5rem 0 2.5rem;
			color: #fff;
			position: relative;
			overflow: hidden;
		}
		.page-hero::before {
			content: '';
			position: absolute; inset: 0;
			background: radial-gradient(ellipse at 70% 50%, rgba(255,117,8,.18) 0%, transparent 65%);
			pointer-events: none;
		}
		.hero-content h1 {
			font-size: 2rem;
			margin: 0 0 .35rem;
			font-family: var(--display);
		}
		.hero-content p {
			color: rgba(255,255,255,.7);
			font-size: .95rem;
			margin: 0;
		}

		.wishlist-section { padding: 3rem 0 4rem; }

		@media (max-width: 640px) {
			.wishlist-grid {
				grid-template-columns: repeat(2, minmax(0, 1fr));
				gap: 0.85rem;
			}
			.page-hero { padding: calc(4.75rem + 1.1rem) 0 1.6rem; }
			.wishlist-section { padding: 1.75rem 0 3rem; }
			.card-media { height: 120px; }
		}

		.wishlist-grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
			gap: 1.5rem;
		}

		.wishlist-card {
			background: var(--card);
			border-radius: 16px;
			border: 1px solid var(--border);
			overflow: hidden;
			box-shadow: 0 2px 12px rgba(38,35,31,.05);
			transition: transform .22s, box-shadow .22s;
			display: flex;
			flex-direction: column;
		}
		.wishlist-card:hover {
			transform: translateY(-4px);
			box-shadow: 0 12px 32px rgba(38,35,31,.1);
		}

		.card-media {
			position: relative;
			height: 160px;
			background: linear-gradient(135deg, #25211c, #3d2a14);
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 1rem;
		}
		.card-media img {
			max-height: 100px;
			object-fit: contain;
		}
		.card-remove-btn {
			position: absolute;
			top: 10px; right: 10px;
			width: 2rem; height: 2rem;
			border-radius: 50%;
			background: rgba(0,0,0,.5);
			color: #fff;
			border: none;
			cursor: pointer;
			display: flex; align-items: center; justify-content: center;
			font-size: .9rem;
			transition: background .2s;
		}
		.card-remove-btn:hover { background: #e53e3e; }

		.card-body {
			padding: 1.25rem;
			flex: 1;
			display: flex;
			flex-direction: column;
		}
		.card-body h3 {
			font-size: 1.05rem;
			margin: 0 0 .5rem;
			color: var(--foreground);
		}
		.card-meta {
			font-size: .825rem;
			color: var(--muted);
			margin-bottom: 1rem;
			display: flex;
			flex-direction: column;
			gap: .35rem;
		}
		.card-footer {
			margin-top: auto;
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding-top: .75rem;
			border-top: 1px solid var(--border);
		}
		.card-price {
			font-weight: 700;
			font-size: 1.1rem;
			color: var(--primary);
		}

		.empty-wishlist {
			text-align: center;
			padding: 4rem 1rem;
			background: var(--card);
			border-radius: 16px;
			border: 1px solid var(--border);
			grid-column: 1 / -1;
		}
		.empty-wishlist-icon { font-size: 3.5rem; margin-bottom: 1rem; }
	</style>
</head>
<body class="sub-page">


	<canvas class="bg-canvas" id="bgCanvas"></canvas>
	<div class="bg-gradient-layer"></div>

	<div class="site-shell" id="top">
		<div id="header"></div>

		<main>
			<section class="page-hero">
				<div class="container">
					<div class="hero-content">
						<h1>Your Wishlist</h1>
						<p>Events you've saved to attend later. Book your tickets before seats sell out!</p>
					</div>
				</div>
			</section>

			<section class="wishlist-section">
				<div class="container">
					<div class="wishlist-grid" id="wishlistGrid">
						<div class="empty-wishlist" id="wishlistLoading">
							<h3>Loading your wishlist…</h3>
						</div>
					</div>
				</div>
			</section>
		</main>

		<div id="footer"></div>
	</div>

	<script src="js/include.js?v=21"></script>
	<script src="js/health.js?v=1"></script>
	<script src="js/auth.js?v=24"></script>
	<script src="js/profile.js?v=8"></script>
	<script src="js/location.js?v=12"></script>
	<script src="js/script.js?v=26"></script>
	<script src="js/events-public.js?v=11"></script>
	<script src="js/wishlist.js?v=1"></script>
	<script>
		(async function loadWishlistPage() {
			const grid = document.getElementById("wishlistGrid");
			const EP = window.JodEventsPublic;
			const WL = window.JodWishlist;

			function emptyHtml() {
				return `
					<div class="empty-wishlist">
						<div class="empty-wishlist-icon">💖</div>
						<h3>Your wishlist is empty</h3>
						<p style="color:var(--muted);margin-bottom:1.5rem;">Explore upcoming events and tap the heart to save your favorites.</p>
						<a href="index.html#upcoming" class="button button-primary">Explore Events &rarr;</a>
					</div>`;
			}

			if (!window.JodAuth || !window.JodAuth.isLoggedIn()) {
				const currentTarget = window.location.pathname + window.location.search + window.location.hash;
				try { sessionStorage.setItem("jod_redirect_after_login", currentTarget); } catch (_) {}
				window.location.href = `login.html?redirect=${encodeURIComponent(currentTarget)}`;
				return;
			}

			const items = WL ? await WL.listItems() : [];
			if (!items.length) {
				grid.innerHTML = emptyHtml();
				return;
			}

			grid.innerHTML = items.map((item) => {
				const ev = item.event || { id: item.event_id };
				const id = ev.id || item.event_id;
				const url = EP ? EP.eventDetailsUrl(ev) : `event-details.html?id=${encodeURIComponent(id)}`;
				const img = EP
					? EP.resolveImage(ev.image_url)
					: ((window.JodConfig && window.JodConfig.assetUrl)
						? window.JodConfig.assetUrl("images/hero-event.jpg")
						: "https://assets.jodevents.com/images/hero-event.jpg");
				const title = EP ? EP.escapeHtml(ev.title || "Saved event") : (ev.title || "Saved event");
				const dateStr = EP ? EP.formatDateIST(ev.start_date) : "";
				const venue = EP ? EP.escapeHtml(ev.venue || ev.location || "Venue TBA") : (ev.venue || "Venue TBA");
				const price = EP ? EP.formatPrice(ev.price) : "";
				return `
					<div class="wishlist-card" data-event-id="${id}">
						<div class="card-media">
							<img src="${img}" alt="${title}" />
							<button type="button" class="card-remove-btn wishlist-heart-btn is-saved" data-wishlist-event="${id}" title="Remove from wishlist" aria-label="Remove from wishlist">
								<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
							</button>
						</div>
						<div class="card-body">
							<h3>${title}</h3>
							<div class="card-meta">
								<span>📅 ${dateStr}</span>
								<span>📍 ${venue}</span>
							</div>
							<div class="card-footer">
								<div class="card-price">${price}</div>
								<a href="${url}" class="button button-sm button-primary">View Details &rarr;</a>
							</div>
						</div>
					</div>`;
			}).join("");

			grid.addEventListener("click", (e) => {
				const btn = e.target.closest("[data-wishlist-event]");
				if (!btn) return;
				setTimeout(() => {
					if (WL && !WL.isSaved(btn.getAttribute("data-wishlist-event"))) {
						const card = btn.closest(".wishlist-card");
						if (card) card.remove();
						if (!grid.querySelector(".wishlist-card")) grid.innerHTML = emptyHtml();
					}
				}, 400);
			});
		})();
	</script>
</body>
</html>
