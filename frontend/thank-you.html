	<title>Thank You | JOD Events</title>

	<style>
		* { box-sizing: border-box; margin: 0; padding: 0; }
		body {
			font-family: 'Grift', sans-serif;
			background: #f8fafc;
			color: #0f172a;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 1.5rem;
		}
		.card {
			width: 100%;
			max-width: 460px;
			background: #ffffff;
			border: 1px solid #e2e8f0;
			border-radius: 18px;
			box-shadow: 0 18px 44px rgba(15, 23, 42, 0.1);
			padding: 2rem 1.5rem 1.6rem;
			text-align: center;
		}
		.mark {
			width: 64px;
			height: 64px;
			margin: 0 auto 1.1rem;
			border-radius: 50%;
			background: #dcfce7;
			color: #166534;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 1.8rem;
			font-weight: 800;
		}
		h1 {
			font-size: 1.35rem;
			font-weight: 800;
			margin-bottom: 0.65rem;
			line-height: 1.3;
		}
		p {
			font-size: 0.95rem;
			color: #475569;
			line-height: 1.55;
			margin-bottom: 0.65rem;
		}
		.qr-wrap {
			display: none;
			margin: 1rem auto 0.5rem;
		}
		.qr-wrap.is-visible { display: block; }
		.qr-wrap img {
			width: 200px;
			height: 200px;
			border-radius: 12px;
			border: 8px solid #fff8f0;
			background: #fff;
		}
		.ticket-btn {
			display: none;
			width: 100%;
			margin-top: 0.85rem;
			padding: 0.9rem;
			border: none;
			border-radius: 10px;
			background: #FF7508;
			color: #ffffff;
			font-family: inherit;
			font-size: 1rem;
			font-weight: 800;
			cursor: pointer;
			text-decoration: none;
		}
		.ticket-btn.is-visible { display: block; }
		.timer {
			color: #64748b;
			font-size: 0.84rem;
			font-weight: 600;
			min-height: 1.3em;
			margin: 1rem 0 0;
		}
		.exit-btn {
			display: none;
			width: 100%;
			margin-top: 1rem;
			padding: 0.9rem;
			border: none;
			border-radius: 10px;
			background: #2563eb;
			color: #ffffff;
			font-family: inherit;
			font-size: 1rem;
			font-weight: 800;
			cursor: pointer;
			text-decoration: none;
		}
		.exit-btn.is-visible { display: block; }
		html[data-theme="dark"] body {
			background: #0e0c0a !important;
			color: #f6f0e8 !important;
		}
		html[data-theme="dark"] .card {
			background: #1c1814 !important;
			border-color: rgba(255, 138, 31, 0.28);
		}
		html[data-theme="dark"] h1 { color: #fff8f0 !important; }
		html[data-theme="dark"] p { color: #d4cbbf !important; }
		html[data-theme="dark"] .timer { color: #b8aea2 !important; }

	<div class="card">
		<div class="mark" aria-hidden="true">✓</div>
		<h1>Payment successful</h1>
		<p id="thankYouLead">Your QR ticket is ready. We also sent it to your email and WhatsApp (when configured).</p>
		<p id="thankYouDetail">Open your ticket below, or find it anytime under Your Orders.</p>
		<div class="qr-wrap" id="thankYouQrWrap">
			<img id="thankYouQrImg" alt="Your ticket QR code" width="200" height="200" />
		</div>
		<a class="ticket-btn" id="thankYouTicket" href="/orders">View my ticket</a>
		<p class="timer" id="thankYouTimer">Exit available in 5s</p>
		<a class="exit-btn" id="thankYouExit" href="/">Exit</a>
	</div>
	<script>
		(function () {
			var timerEl = document.getElementById("thankYouTimer");
			var exitEl = document.getElementById("thankYouExit");
			var ticketBtn = document.getElementById("thankYouTicket");
			var qrWrap = document.getElementById("thankYouQrWrap");
			var qrImg = document.getElementById("thankYouQrImg");
			var leadEl = document.getElementById("thankYouLead");
			var detailEl = document.getElementById("thankYouDetail");
			var remaining = 5;
			var ticket = null;
			try {
				ticket = JSON.parse(sessionStorage.getItem("jod_ticket_ready") || "null");
			} catch (_) {
				ticket = null;
			}
			if (exitEl && window.JodUrls && typeof window.JodUrls.prettyHref === "function") {
				exitEl.setAttribute("href", window.JodUrls.prettyHref("index.html") || "/");
			}
			var ordersHref = "/orders";
			if (window.JodUrls && typeof window.JodUrls.prettyHref === "function") {
				ordersHref = window.JodUrls.prettyHref("orders.html") || ordersHref;
			}
			if (ticket && ticket.ticket_url) {
				if (ticketBtn) {
					ticketBtn.href = ticket.ticket_url;
					ticketBtn.classList.add("is-visible");
				}
			} else if (ticketBtn) {
				ticketBtn.href = ordersHref;
				ticketBtn.classList.add("is-visible");
				ticketBtn.textContent = "Go to Your Orders";
			}
			if (ticket && ticket.qr_image_url && qrWrap && qrImg) {
				qrImg.src = ticket.qr_image_url;
				qrWrap.classList.add("is-visible");
			}
			if (ticket && !ticket.qr_token) {
				if (leadEl) leadEl.textContent = "Payment received. Your ticket is being prepared.";
				if (detailEl) detailEl.textContent = "Check Your Orders shortly, or contact support if it does not appear.";
			} else if (ticket && ticket.qr_token) {
				var bits = [];
				if (ticket.email_sent) bits.push("email");
				if (ticket.whatsapp_sent) bits.push("WhatsApp");
				if (leadEl) {
					leadEl.textContent = bits.length
						? ("Your QR ticket is ready and was sent via " + bits.join(" and ") + ".")
						: "Your QR ticket is ready on the website. Email/WhatsApp send when SMTP / WhatsApp API are configured.";
				}
			}
			var tick = setInterval(function () {
				remaining -= 1;
				if (remaining <= 0) {
					clearInterval(tick);
					if (timerEl) timerEl.textContent = "";
					if (exitEl) exitEl.classList.add("is-visible");
					return;
				}
				if (timerEl) timerEl.textContent = "Exit available in " + remaining + "s";
			}, 1000);
		})();
	</script>
</body>
