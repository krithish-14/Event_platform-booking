	<style>
		/* ── Orders Page ─────────────────────────────────────── */
		.page-hero {
			background: linear-gradient(135deg, var(--dark) 0%, var(--dark-soft) 60%, #3d2a14 100%);
			padding: calc(var(--site-header-height, 6.25rem) + 1.75rem) 0 2.5rem;
			color: #fff;
			position: relative;
			overflow: hidden;
		}
		.page-hero::before {
			content: '';
			position: absolute; inset: 0;
			background: radial-gradient(ellipse at 70% 50%, rgba(255,117,8,.18) 0%, transparent 65%);
			pointer-events: none;
		}
		.hero-content h1 {
			font-size: 2rem;
			margin: 0 0 .35rem;
			font-family: var(--display);
		}
		.hero-content p {
			color: rgba(255,255,255,.7);
			font-size: .95rem;
			margin: 0;
		}

		.orders-section { padding: 3rem 0 4rem; }

		.orders-filter-bar {
			display: flex;
			gap: .75rem;
			margin-bottom: 2rem;
			border-bottom: 1px solid var(--border);
			padding-bottom: .75rem;
			overflow-x: auto;
		}
		.filter-tab {
			background: none;
			border: none;
			padding: .5rem 1.125rem;
			font-size: .9rem;
			font-weight: 600;
			color: var(--muted);
			cursor: pointer;
			border-radius: 999px;
			transition: all .2s ease;
			white-space: nowrap;
		}
		.filter-tab:hover {
			color: var(--primary);
			background: rgba(255,117,8,.08);
		}
		.filter-tab.is-active {
			background: var(--primary);
			color: #fff;
			box-shadow: 0 4px 14px rgba(255,117,8,.3);
		}

		.order-card {
			background: var(--card);
			border-radius: 16px;
			border: 1px solid var(--border);
			padding: 1.5rem;
			margin-bottom: 1.25rem;
			box-shadow: 0 2px 12px rgba(38,35,31,.04);
			display: grid;
			grid-template-columns: 100px minmax(0, 1fr) auto;
			grid-template-areas: "thumb details action";
			gap: 1.5rem;
			align-items: center;
			transition: transform .2s, box-shadow .2s;
			overflow: hidden;
		}
		.order-card:hover {
			transform: translateY(-2px);
			box-shadow: 0 8px 24px rgba(38,35,31,.08);
		}

		.order-thumb {
			grid-area: thumb;
			width: 100%;
			height: 80px;
			max-width: 100%;
			border-radius: 12px;
			overflow: hidden;
			background: #f4efea;
			align-self: start;
		}
		.order-thumb img {
			display: block;
			width: 100%;
			height: 100%;
			object-fit: cover;
			position: static;
		}
		.order-details {
			grid-area: details;
			min-width: 0;
			position: relative;
			z-index: 1;
		}
		.order-details .badge {
			position: static;
			margin: 0 0 0.3rem;
		}
		.order-details h3 {
			font-size: 1.1rem;
			margin: 0 0 .35rem;
			color: var(--foreground);
			overflow-wrap: anywhere;
		}
		.order-meta {
			display: flex;
			flex-wrap: wrap;
			gap: 1rem;
			font-size: .825rem;
			color: var(--muted);
			margin-bottom: .5rem;
		}
		.order-meta span { display: flex; align-items: center; gap: .35rem; }
		.order-id { font-size: .78rem; color: #9ca3af; font-family: inherit; overflow-wrap: anywhere; }

		.badge {
			display: inline-flex;
			align-items: center;
			padding: .25rem .75rem;
			border-radius: 999px;
			font-size: .75rem;
			font-weight: 700;
			letter-spacing: .02em;
			text-transform: uppercase;
		}
		.badge-confirmed { background: rgba(34,197,94,.12); color: #16a34a; }
		.badge-upcoming { background: rgba(255,117,8,.12); color: var(--primary); }
		.badge-completed { background: rgba(107,114,128,.12); color: #4b5563; }
		.badge-checkedin { background: #10b981; color: #fff; }
		.badge-cancel-requested { background: #fff7ed; color: #c2410c; border: 1px solid #fdba74; }
		.badge-cancelled { background: rgba(231,76,60,.15); color: #e74c3c; border: 1px solid #e74c3c; }

		.order-action-btns {
			display: flex;
			flex-wrap: wrap;
			gap: .5rem;
			justify-content: flex-end;
		}
		.empty-panel {
			background: var(--card);
			color: var(--muted);
		}
		.btn-cancel-order {
			background: var(--card);
			border: 1.5px solid #dc2626;
			color: #dc2626;
			padding: .45rem .9rem;
			border-radius: 8px;
			font-size: .8rem;
			font-weight: 700;
			cursor: pointer;
		}
		.btn-cancel-order:hover { background: #fef2f2; }

		.order-cancel-modal {
			position: fixed;
			inset: 0;
			z-index: 10000;
			background: rgba(15,23,42,.72);
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 1.25rem;
		}
		.order-cancel-card {
			background: var(--card);
			border-radius: 16px;
			max-width: 520px;
			width: 100%;
			overflow: hidden;
			box-shadow: 0 25px 60px rgba(0,0,0,.35);
		}

		.order-action {
			grid-area: action;
			display: flex;
			flex-direction: column;
			align-items: flex-end;
			gap: .75rem;
			min-width: 0;
		}
		.order-price {
			font-size: 1.25rem;
			font-weight: 700;
			color: var(--foreground);
		}

		@media (max-width: 800px) {
			.order-card {
				grid-template-columns: 72px minmax(0, 1fr);
				grid-template-areas:
					"thumb details"
					"action action";
				gap: 0.55rem 0.7rem;
				padding: 0.75rem;
				align-items: start;
			}
			.order-card:hover { transform: none; }
			.order-thumb {
				width: 100%;
				height: 72px;
			}
			.order-details h3 {
				font-size: 0.92rem;
				line-height: 1.25;
				margin-bottom: 0.2rem;
			}
			.order-details .badge {
				padding: 0.12rem 0.45rem;
				font-size: 0.62rem;
			}
			.order-meta {
				flex-direction: column;
				flex-wrap: nowrap;
				gap: 0.12rem;
				margin-bottom: 0.2rem;
				font-size: 0.75rem;
			}
			.order-meta span {
				min-width: 0;
				overflow-wrap: anywhere;
				word-break: break-word;
			}
			.order-id { font-size: 0.7rem; }
			.order-action {
				flex-direction: row;
				flex-wrap: wrap;
				align-items: center;
				justify-content: space-between;
				gap: 0.4rem;
				width: 100%;
			}
			.order-price { font-size: 0.98rem; }
			.order-action-btns {
				justify-content: flex-end;
				flex: 1 1 auto;
				min-width: 0;
				gap: 0.35rem;
			}
			.order-action-btns .button,
			.order-action-btns .btn-cancel-order {
				flex: 0 1 auto;
				white-space: nowrap;
				font-size: 0.68rem;
				padding: 0.32rem 0.55rem;
			}
			.page-hero { padding: calc(var(--site-header-height, 6.25rem) + 1.25rem) 0 1.6rem; }
			.orders-section { padding: 1.75rem 0 3rem; }
		}
	</style>

	<script>
		// Auth check & filter tabs logic — confirm cookie session before rendering
		(async function guardOrdersPage() {
			const currentTarget = window.location.pathname + window.location.search + window.location.hash;
			if (!(window.JodAuth && typeof window.JodAuth.requireAuthOrRedirect === "function")) {
				try { sessionStorage.setItem("jod_redirect_after_login", currentTarget); } catch (_) {}
				window.location.replace(`login.html?redirect=${encodeURIComponent(currentTarget)}`);
				return;
			}
			const user = await window.JodAuth.requireAuthOrRedirect({ redirectTo: currentTarget });
			if (!user) return;
		})();

		let allBookingsData = [];
		let activeOrdersFilter = "all";

		function getApiBase() {
			if (window.JodConfig && typeof window.JodConfig.getApiOrigin === "function") {
				return window.JodConfig.getApiOrigin();
			}
			if (window.JodHealth && typeof window.JodHealth.getApiBaseUrl === "function") {
				return window.JodHealth.getApiBaseUrl();
			}
			return "";
		}

		function escapeHtml(str) {
			return String(str || "")
				.replace(/&/g, "&amp;")
				.replace(/</g, "&lt;")
				.replace(/>/g, "&gt;")
				.replace(/"/g, "&quot;");
		}

		function resolveOrderImage(url) {
			const fallback = (window.JodConfig && window.JodConfig.assetUrl)
				? window.JodConfig.assetUrl("images/hero-event.jpg")
				: "https://assets.jodevents.com/images/hero-event.jpg";
			if (!url) return fallback;
			if (/^(https?:|data:|blob:)/i.test(url)) return url;
			if (url.startsWith("images/") || url.startsWith("./images/") || url.startsWith("/images/")) {
				return (window.JodConfig && window.JodConfig.assetUrl)
					? window.JodConfig.assetUrl(url)
					: fallback;
			}
			const cleaned = String(url).replace(/^\//, "");
			if (
				cleaned.startsWith("api/media") ||
				cleaned.startsWith("uploads/") ||
				cleaned.startsWith("api/") ||
				cleaned.startsWith("media/")
			) {
				return `${getApiBase().replace(/\/$/, "")}/${cleaned}`;
			}
			return `${getApiBase().replace(/\/$/, "")}/${cleaned}`;
		}

		function isCancelledBooking(b) {
			const status = String(b.status || "").toUpperCase();
			return status === "CANCELLED" || status === "CANCELED" || status === "REFUNDED"
				|| b.event_is_cancelled === true || String(b.event_is_cancelled || "").toLowerCase() === "true";
		}

		function isCheckedInBooking(b) {
			if (isCancelledBooking(b)) return false;
			if (b.used_at) return true;
			const ticketStatus = String(b.ticket_status || "").toUpperCase().replace(/[_-]+/g, " ").trim();
			return ticketStatus === "USED" || ticketStatus === "CHECKED IN";
		}

		function isCancellationRequested(b) {
			return String(b.status || "").toUpperCase() === "CANCELLATION_REQUESTED";
		}

		function hasGeneratedTicket(b) {
			const status = (b.status || "").toUpperCase();
			if (status === "CANCELLED" || status === "CANCELED") return false;
			return Boolean(b.qr_token || b.has_qr);
		}

		function isCompletedBooking(b) {
			if (isCancelledBooking(b)) return false;
			return hasGeneratedTicket(b) || isCheckedInBooking(b);
		}

		function canShowViewTicket(b) {
			return !isCancelledBooking(b) && !isCheckedInBooking(b);
		}

		function canShowCancel(b) {
			return canShowViewTicket(b) && !isCancellationRequested(b);
		}

		function hoursUntilEvent(b) {
			if (!b.event_start_date) return Infinity;
			const start = new Date(b.event_start_date).getTime();
			if (isNaN(start)) return Infinity;
			return (start - Date.now()) / (1000 * 60 * 60);
		}

		function closeCancelBookingModal() {
			const modal = document.getElementById("orderCancelModal");
			if (modal) modal.remove();
		}

		function openCancelBookingModal(bookingId) {
			const booking = allBookingsData.find((b) => String(b.booking_id) === String(bookingId));
			if (!booking) return;
			closeCancelBookingModal();

			const hoursLeft = hoursUntilEvent(booking);
			const used = isCheckedInBooking(booking);
			const tooLate = hoursLeft < 24;
			const title = booking.event_title || "this event";
			let body = "";
			let actions = `<button type="button" id="orderCancelKeep" class="empty-panel" style="border:1.5px solid var(--border);color:var(--muted);padding:.55rem 1.15rem;border-radius:8px;font-weight:700;cursor:pointer;">Keep ticket</button>`;

			if (used) {
				body = `<p style="margin:0 0 .75rem;color:#334155;line-height:1.55;">This ticket for <strong>${escapeHtml(title)}</strong> is already checked in at the venue, so it cannot be cancelled or refunded.</p>`;
			} else if (tooLate) {
				body = `<p style="margin:0 0 .75rem;color:#334155;line-height:1.55;">Cancellation for <strong>${escapeHtml(title)}</strong> is only available up to 24 hours before showtime. The window for this booking has closed.</p>
					<p style="margin:0;color:#64748b;font-size:.9rem;">For help, contact JOD Events support at <strong>support@jodevents.com</strong> or <strong>+91 1800-563-383</strong>.</p>`;
			} else {
				body = `
					<p style="margin:0 0 .85rem;color:#334155;line-height:1.55;">You are requesting cancellation for <strong>${escapeHtml(title)}</strong>. The event host will review this request before the ticket is cancelled.</p>
					<ul style="margin:0 0 1rem;padding-left:1.15rem;color:#475569;font-size:.92rem;line-height:1.55;">
						<li>Requests are accepted up to <strong>24 hours before showtime</strong>.</li>
						<li>Your QR stays valid until the host confirms cancellation.</li>
						<li>After the host cancels, this ticket cannot be used for entry.</li>
						<li>Refunds are processed to the original payment method, usually within 5–7 business days.</li>
					</ul>
					<p style="margin:0;font-size:.85rem;color:#64748b;">By confirming, you send this cancellation request to the host.</p>`;
				actions += `<button type="button" id="orderCancelConfirm" style="background:linear-gradient(135deg,#dc2626 0%,#991b1b 100%);color:#fff;border:none;padding:.55rem 1.2rem;border-radius:8px;font-weight:700;cursor:pointer;">Send cancellation request</button>`;
			}

			const modal = document.createElement("div");
			modal.id = "orderCancelModal";
			modal.className = "order-cancel-modal";
			modal.innerHTML = `
				<div class="order-cancel-card">
					<div style="padding:1.35rem 1.6rem;background:linear-gradient(135deg,#dc2626 0%,#991b1b 100%);color:#fff;">
						<div style="font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.92;margin-bottom:.3rem;">Cancellation process</div>
						<h3 style="margin:0;font-size:1.2rem;font-weight:800;">Cancel this ticket?</h3>
					</div>
					<div style="padding:1.4rem 1.6rem;">${body}<p id="orderCancelStatus" style="min-height:1.1rem;margin:.85rem 0 0;font-size:.85rem;font-weight:600;color:#dc2626;"></p></div>
					<div style="display:flex;justify-content:flex-end;gap:.65rem;padding:1rem 1.6rem 1.35rem;border-top:1px solid #e2e8f0;background:#f8fafc;">${actions}</div>
				</div>`;
			document.body.appendChild(modal);
			document.getElementById("orderCancelKeep")?.addEventListener("click", closeCancelBookingModal);
			modal.addEventListener("click", (e) => { if (e.target === modal) closeCancelBookingModal(); });
			document.getElementById("orderCancelConfirm")?.addEventListener("click", async () => {
				const statusEl = document.getElementById("orderCancelStatus");
				const confirmBtn = document.getElementById("orderCancelConfirm");
				if (confirmBtn) confirmBtn.disabled = true;
				if (statusEl) statusEl.textContent = "Sending your cancellation request…";
				try {
					const fetchFn = (window.JodAuth && typeof window.JodAuth.fetchAuth === "function")
						? window.JodAuth.fetchAuth.bind(window.JodAuth)
						: fetch;
					const res = await fetchFn(`${getApiBase()}/api/bookings/${encodeURIComponent(bookingId)}/cancel`, {
						method: "POST"
					});
					const data = await res.json().catch(() => ({}));
					if (!res.ok) throw new Error(data.detail || "Could not send this cancellation request.");
					const idx = allBookingsData.findIndex((b) => String(b.booking_id) === String(bookingId));
					if (idx >= 0) allBookingsData[idx] = { ...allBookingsData[idx], ...data, status: data.status || "CANCELLATION_REQUESTED" };
					saveLocalBookingsCache(allBookingsData);
					closeCancelBookingModal();
					renderOrders(activeOrdersFilter);
				} catch (err) {
					if (statusEl) statusEl.textContent = err.message || "Could not cancel this ticket.";
					if (confirmBtn) confirmBtn.disabled = false;
				}
			});
		}

		function bookingsStorageKey() {
			if (window.JodAuth && typeof window.JodAuth.bookingsCacheKey === "function") {
				return window.JodAuth.bookingsCacheKey();
			}
			return null;
		}

		function getLocalBookingsCache() {
			try {
				const key = bookingsStorageKey();
				if (!key) return [];
				const raw = localStorage.getItem(key);
				return raw ? JSON.parse(raw) : [];
			} catch (_) {
				return [];
			}
		}

		function saveLocalBookingsCache(bookings) {
			try {
				const key = bookingsStorageKey();
				if (!key) return;
				localStorage.setItem(key, JSON.stringify(bookings));
			} catch (_) {}
		}

		async function renderOrders(filter = "all") {
			const container = document.getElementById("ordersListContainer");
			if (!container) return;

			if (!allBookingsData || allBookingsData.length === 0) {
				container.innerHTML = `
					<div class="empty-panel" style="border-radius:16px;border:1px solid var(--border);padding:3.5rem 1.5rem;text-align:center;color:var(--muted)">
						<div style="font-size:3rem;margin-bottom:1rem;">🎟️</div>
						<h3 style="font-size:1.15rem;color:var(--foreground);margin:0 0 .5rem;">No Event Bookings Found</h3>
						<p style="font-size:.9rem;margin:0 0 1.25rem;">You haven't purchased any tickets yet. Explore upcoming events and book your seats!</p>
						<a href="/#upcoming" class="button button-primary button-sm" style="display:inline-flex;align-items:center;gap:.5rem;">Explore Events &rarr;</a>
					</div>`;
				return;
			}

			const filtered = allBookingsData.filter(b => {
				if (filter === "completed") return isCompletedBooking(b);
				if (filter === "cancelled") return isCancelledBooking(b);
				return true;
			});

			if (filtered.length === 0) {
				container.innerHTML = `<div class="empty-panel" style="border-radius:16px;border:1px solid var(--border);padding:2.5rem;text-align:center;color:var(--muted)">No ${filter} bookings found.</div>`;
				return;
			}

			let html = "";
			filtered.forEach(b => {
				const cancelled = isCancelledBooking(b);

				let statusBadge = `<span class="badge badge-completed">Completed</span>`;
				if (cancelled) {
					statusBadge = `<span class="badge badge-cancelled">Cancelled</span>`;
				} else if (isCheckedInBooking(b)) {
					statusBadge = `<span class="badge badge-checkedin">Checked in</span>`;
				} else if (isCancellationRequested(b)) {
					statusBadge = `<span class="badge badge-cancel-requested">Cancellation requested</span>`;
				}

				const dateStr = b.event_start_date ? new Date(b.event_start_date).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "Date TBA";
				const shortId = (b.booking_id || "00000000").substring(0, 8).toUpperCase();
				const imgSrc = resolveOrderImage(b.card_image || b.image_url);
				const showView = canShowViewTicket(b);
				const showCancel = canShowCancel(b);

				const ticketHref = b.qr_token
					? `ticket-details.html?token=${encodeURIComponent(b.qr_token)}&id=${encodeURIComponent(b.booking_id)}`
					: `ticket-details.html?id=${encodeURIComponent(b.booking_id)}`;
				const detailsAttrs = showView
					? ` style="cursor:pointer;" onclick="window.location.href='${ticketHref}'"`
					: "";
				const actionBtns = (showView || showCancel)
					? `<div class="order-action-btns">
								${showView ? `<a class="button button-sm button-primary" href="${ticketHref}">View Ticket &amp; QR 🎟️</a>` : ""}
								${showCancel ? `<button type="button" class="btn-cancel-order" data-cancel-id="${escapeHtml(b.booking_id)}">Cancel</button>` : ""}
							</div>`
					: "";
				html += `
					<div class="order-card" data-status="${cancelled ? 'cancelled' : 'completed'}">
						<div class="order-thumb">
							<img src="${escapeHtml(imgSrc)}" alt="${escapeHtml(b.event_title || 'Event Ticket')}" onerror="this.onerror=null;this.src=(window.JodConfig&&window.JodConfig.assetUrl?window.JodConfig.assetUrl('images/hero-event.jpg'):'https://assets.jodevents.com/images/hero-event.jpg')" />
						</div>
						<div class="order-details"${detailsAttrs}>
							${statusBadge}
							<h3>${escapeHtml(b.event_title || 'Event Booking')}</h3>
							<div class="order-meta">
								<span>📅 ${escapeHtml(dateStr)}</span>
								<span>📍 ${escapeHtml(b.event_venue || 'Venue details in ticket')}</span>
								<span>🎟️ ${escapeHtml(b.ticket_type || 'Access Pass')} (x${b.quantity || 1})</span>
							</div>
							<div style="display:flex;align-items:center;gap:.75rem;margin-top:.25rem;flex-wrap:wrap;">
								<span class="order-id">Order ID: #JOD-${shortId}</span>
							</div>
						</div>
						<div class="order-action">
							<div class="order-price">₹${Number(b.total_price || 0).toLocaleString('en-IN')}</div>
							${actionBtns}
						</div>
					</div>`;
			});

			container.innerHTML = html;
			container.querySelectorAll("[data-cancel-id]").forEach((btn) => {
				btn.addEventListener("click", (e) => {
					e.preventDefault();
					e.stopPropagation();
					openCancelBookingModal(btn.getAttribute("data-cancel-id"));
				});
			});
		}

		async function fetchUserOrders() {
			allBookingsData = getLocalBookingsCache();
			renderOrders(activeOrdersFilter);

			try {
				const apiBase = getApiBase();
				const fetchFn = (window.JodAuth && typeof window.JodAuth.fetchAuth === "function")
					? window.JodAuth.fetchAuth.bind(window.JodAuth)
					: fetch;
				const res = await fetchFn(`${apiBase}/api/bookings/my-bookings?include_all=true`, {
					cache: "no-store",
					headers: { Accept: "application/json" }
				});
				if (res.ok) {
					const remoteData = await res.json();
					if (Array.isArray(remoteData)) {
						allBookingsData = remoteData.slice().sort((a, b) => new Date(b.booked_at || 0) - new Date(a.booked_at || 0));
						saveLocalBookingsCache(allBookingsData);
						renderOrders(activeOrdersFilter);
						if (window.JodInbox && typeof window.JodInbox.refresh === "function") {
							window.JodInbox.refresh({ toastNew: true });
						}
					}
				}
			} catch (_) {}
		}

		document.addEventListener("DOMContentLoaded", () => {
			fetchUserOrders();

			document.addEventListener("visibilitychange", () => {
				if (document.visibilityState === "visible") fetchUserOrders();
			});
			window.addEventListener("focus", fetchUserOrders);

			document.querySelectorAll(".filter-tab").forEach(tab => {
				tab.addEventListener("click", () => {
					document.querySelectorAll(".filter-tab").forEach(t => t.classList.remove("is-active"));
					tab.classList.add("is-active");
					activeOrdersFilter = tab.dataset.filter;
					renderOrders(activeOrdersFilter);
				});
			});
		});

	</script>
</body>
</html>
