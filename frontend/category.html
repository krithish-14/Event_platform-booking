<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="description" content="Explore events by category on JOD Events — Workshops, Corporate Conferences, Concerts, Standup Comedy, Weddings, and more." />
	<title>Browse Events by Category — JOD Events</title>
	<link rel="icon" type="image/png" href="https://assets.jodevents.com/images/JOD Logo.png" />
	<link rel="apple-touch-icon" href="https://assets.jodevents.com/images/JOD Logo.png" />

<body class="sub-page category-page">
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PFZVZGJR"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

	<div id="header"></div>

	<main class="category-main">
		<!-- ── Category Header & Top Sub-Topics ────────────────────────── -->
		<section class="category-hero-section">
			<div class="container">
				<div class="category-header-info">
					<h1 class="category-title" id="categoryTitle">Event Categories</h1>
				</div>
			</div>
		</section>

		<!-- ── Category Layout Container (Sidebar + Main Grid) ────────── -->
		<section class="category-content-section">
			<div class="container cat-layout">
				<!-- Left Sidebar Filter Panel -->
				<aside class="cat-sidebar" id="catSidebar">
					<div class="sidebar-header">
						<h3>Filters</h3>
						<button class="btn-clear-all" type="button" id="btnClearAllFilters">Clear All</button>
					</div>

					<!-- Filter dropdown: Categories -->
					<div class="filter-group">
						<div class="filter-group-header">
							<span>Categories</span>
							<button class="btn-clear-group" type="button" data-clear="category">Clear</button>
						</div>
						<div class="filter-dropdown" data-filter-dropdown>
							<button type="button" class="filter-dropdown-btn" aria-expanded="false" aria-haspopup="listbox">
								<span class="filter-dropdown-current">All</span>
								<svg class="filter-dropdown-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
							</button>
							<div class="filter-dropdown-panel" role="listbox">
								<div class="filter-chips-grid" id="filterCategoriesList">
									<button class="filter-chip active" type="button" data-category="all">All</button>
									<button class="filter-chip" type="button" data-category="Sports">Sports</button>
									<button class="filter-chip" type="button" data-category="Conferences">Conferences</button>
									<button class="filter-chip" type="button" data-category="Performances">Performances</button>
									<button class="filter-chip" type="button" data-category="Parties">Parties</button>
									<button class="filter-chip" type="button" data-category="Workshops">Workshops</button>
								</div>
							</div>
						</div>
					</div>

					<!-- Filter dropdown: Date -->
					<div class="filter-group">
						<div class="filter-group-header">
							<span>Date</span>
							<button class="btn-clear-group" type="button" data-clear="date">Clear</button>
						</div>
						<div class="filter-dropdown" data-filter-dropdown>
							<button type="button" class="filter-dropdown-btn" aria-expanded="false" aria-haspopup="listbox">
								<span class="filter-dropdown-current">All Dates</span>
								<svg class="filter-dropdown-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
							</button>
							<div class="filter-dropdown-panel" role="listbox">
								<div class="filter-chips-grid" id="filterDateList">
									<button class="filter-chip active" type="button" data-date="all">All Dates</button>
									<button class="filter-chip" type="button" data-date="today">Today</button>
									<button class="filter-chip" type="button" data-date="tomorrow">Tomorrow</button>
									<button class="filter-chip" type="button" data-date="weekend">This Weekend</button>
								</div>
							</div>
						</div>
					</div>

					<!-- Filter dropdown: Format -->
					<div class="filter-group">
						<div class="filter-group-header">
							<span>Format</span>
							<button class="btn-clear-group" type="button" data-clear="format">Clear</button>
						</div>
						<div class="filter-dropdown" data-filter-dropdown>
							<button type="button" class="filter-dropdown-btn" aria-expanded="false" aria-haspopup="listbox">
								<span class="filter-dropdown-current">All Formats</span>
								<svg class="filter-dropdown-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
							</button>
							<div class="filter-dropdown-panel" role="listbox">
								<div class="filter-chips-grid" id="filterFormatList">
									<button class="filter-chip active" type="button" data-format="all">All Formats</button>
									<button class="filter-chip" type="button" data-format="in-person">In-Person</button>
									<button class="filter-chip" type="button" data-format="online">Online Streaming</button>
									<button class="filter-chip" type="button" data-format="hybrid">Hybrid</button>
								</div>
							</div>
						</div>
					</div>

					<!-- Filter dropdown: Price -->
					<div class="filter-group">
						<div class="filter-group-header">
							<span>Price</span>
							<button class="btn-clear-group" type="button" data-clear="price">Clear</button>
						</div>
						<div class="filter-dropdown" data-filter-dropdown>
							<button type="button" class="filter-dropdown-btn" aria-expanded="false" aria-haspopup="listbox">
								<span class="filter-dropdown-current">All</span>
								<svg class="filter-dropdown-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
							</button>
							<div class="filter-dropdown-panel" role="listbox">
								<div class="filter-chips-grid" id="filterPriceList">
									<button class="filter-chip active" type="button" data-price="all">All</button>
									<button class="filter-chip" type="button" data-price="free">Free</button>
									<button class="filter-chip" type="button" data-price="0-500">₹0 - 500</button>
									<button class="filter-chip" type="button" data-price="501-2000">₹501 - 2000</button>
									<button class="filter-chip" type="button" data-price="above-2000">Above ₹2000</button>
								</div>
							</div>
						</div>
					</div>
				</aside>

				<!-- Right Main Events Area -->
				<div class="cat-main-content">
					<div class="results-bar">
						<div class="results-info">
							<span class="results-count" id="resultsCount">Loading events…</span>
							<div class="active-tags-container" id="activeTagsContainer"></div>
						</div>
					</div>

					<!-- Events Grid -->
					<div class="category-events-grid" id="categoryEventsGrid">
						<!-- Dynamic Event Cards rendered via category.js -->
					</div>

					<!-- Empty State Container -->
					<div class="cat-empty-state" id="catEmptyState" hidden>
						<div class="empty-state-icon">🔍</div>
						<h3>No Events Found</h3>
						<p>We couldn't find any events matching your selected filters. Try clearing some filters to explore more events.</p>
						<button class="button button-primary" type="button" id="btnResetFilters">Reset Filters</button>
					</div>
				</div>
			</div>
		</section>
	</main>

	<div id="footer"></div>

	<script src="js/search.js?v=1"></script>
	<script src="js/script.js?v=27"></script>
	<script src="js/events-public.js?v=20260831_v21"></script>
	<script src="js/wishlist.js?v=1"></script>
	<script src="js/category.js?v=10"></script>
</body>
</html>
