<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Settings | JOD Events</title>
<meta name="robots" content="noindex" />
<script>
(function () {
	var hash = window.location.hash || "#settings";
	if (!hash || hash === "#") hash = "#settings";
	window.location.replace("dashboard.html" + hash);
})();
</script>
</head>
<body>
<p>Redirecting to <a href="dashboard.html#settings">Profile Settings</a>.</p>
</body>
</html>
