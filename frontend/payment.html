<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta http-equiv="Cache-Control" content="no-store" />
	<title>Ticket Bill | JOD Events</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
	<style>
		* { box-sizing: border-box; margin: 0; padding: 0; }
		body {
			font-family: 'Outfit', system-ui, sans-serif;
			background: #f8fafc;
			color: #0f172a;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 1.5rem;
		}
		.wrap {
			width: 100%;
			max-width: 480px;
		}
		h1 {
			font-size: 1.45rem;
			font-weight: 800;
			margin-bottom: 0.35rem;
		}
		.sub {
			color: #64748b;
			font-size: 0.92rem;
			line-height: 1.55;
			margin-bottom: 1.2rem;
		}
		.bill-card {
			background: #ffffff;
			border: 1px solid #e2e8f0;
			border-radius: 16px;
			box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
			padding: 1.15rem 1.2rem 0.55rem;
		}
		.bill-card h2 {
			margin: 0 0 0.75rem;
			font-size: 0.78rem;
			font-weight: 800;
			letter-spacing: 0.07em;
			text-transform: uppercase;
			color: #64748b;
		}
		.row {
			display: flex;
			justify-content: space-between;
			gap: 1rem;
			padding: 0.62rem 0;
			border-bottom: 1px solid #f1f5f9;
			font-size: 0.92rem;
		}
		.row:last-of-type { border-bottom: none; }
		.row span:first-child { color: #64748b; font-weight: 600; }
		.row span:last-child { font-weight: 700; text-align: right; }
		.row.is-total span:last-child { color: #2563eb; font-weight: 800; }
		.status {
			display: inline-block;
			background: #fff7ed;
			color: #c2410c;
			border: 1px solid #fed7aa;
			font-size: 0.72rem;
			font-weight: 800;
			padding: 0.18rem 0.55rem;
			border-radius: 999px;
		}
		.pay-btn {
			width: 100%;
			margin-top: 1.2rem;
			padding: 0.9rem;
			border: none;
			border-radius: 10px;
			background: #2563eb;
			color: #ffffff;
			font-family: inherit;
			font-size: 1rem;
			font-weight: 800;
			cursor: pointer;
		}
		.pay-btn:disabled { opacity: 0.55; cursor: not-allowed; }
		.back {
			display: block;
			text-align: center;
			margin-top: 0.9rem;
			color: #64748b;
			font-size: 0.85rem;
			font-weight: 600;
			text-decoration: none;
		}
		.err { color: #b91c1c; font-size: 0.85rem; margin-top: 0.75rem; min-height: 1.1em; }
	</style>
</head>
<body>
	<div class="wrap">
		<h1>Ticket bill</h1>
		<p class="sub">Complete payment to finish your registration.</p>
		<div class="bill-card">
			<h2>Selected ticket</h2>
			<div class="row"><span>Event</span><span id="payEvent">Loading…</span></div>
			<div class="row" id="venueRow" hidden><span>Venue</span><span id="payVenue"></span></div>
			<div class="row"><span>Ticket</span><span id="payTicket">—</span></div>
			<div class="row"><span>Quantity</span><span id="payQty">1</span></div>
			<div class="row is-total"><span>Amount</span><span id="payAmount">—</span></div>
			<div class="row"><span>Status</span><span><span class="status">Payment pending</span></span></div>
		</div>
		<button type="button" class="pay-btn" id="payBtn">Payment</button>
		<p class="err" id="payError"></p>
		<a class="back" id="payBack" href="index.html">Back to event</a>
	</div>

	<script src="js/health.js?v=1"></script>
	<script src="js/auth.js?v=16"></script>
	<script>
		(function () {
			const params = new URLSearchParams(window.location.search);
			let saved = {};
			try { saved = JSON.parse(sessionStorage.getItem("jod_pending_ticket_bill") || "{}") || {}; } catch (_) { saved = {}; }

			function prettyTicket(raw) {
				const value = String(raw || "").replace(/\+/g, " ").trim();
				if (!value) return "General Admission";
				try { return decodeURIComponent(value); } catch (_) { return value; }
			}

			const eventId = params.get("eventId") || saved.eventId || "";
			const ticket = prettyTicket(params.get("ticket") || saved.ticket || "General Admission");
			const price = Number(params.get("price") || saved.price || 0);
			const qty = Number(saved.quantity || 1) || 1;
			const apiBase = (window.JodAuth && window.JodAuth.API_BASE) || "http://127.0.0.1:8001";

			const eventEl = document.getElementById("payEvent");
			const venueRow = document.getElementById("venueRow");
			const venueEl = document.getElementById("payVenue");
			const ticketEl = document.getElementById("payTicket");
			const qtyEl = document.getElementById("payQty");
			const amountEl = document.getElementById("payAmount");
			const backEl = document.getElementById("payBack");
			const btn = document.getElementById("payBtn");
			const errEl = document.getElementById("payError");

			if (ticketEl) ticketEl.textContent = ticket;
			if (qtyEl) qtyEl.textContent = String(qty);
			if (amountEl) amountEl.textContent = price > 0 ? ("₹" + price.toLocaleString("en-IN")) : "Free";
			if (eventEl && saved.eventTitle) eventEl.textContent = saved.eventTitle;
			if (saved.venue && venueEl && venueRow) {
				venueEl.textContent = saved.venue;
				venueRow.hidden = false;
			}
			if (eventId && backEl) backEl.href = "event-details.html?id=" + encodeURIComponent(eventId);

			async function loadEvent() {
				if (!eventId) {
					if (eventEl && !saved.eventTitle) eventEl.textContent = "Event";
					return;
				}
				try {
					const res = await fetch(apiBase + "/api/events/public/" + encodeURIComponent(eventId));
					if (!res.ok) throw new Error("Event unavailable");
					const data = await res.json();
					if (eventEl) eventEl.textContent = data.title || saved.eventTitle || "Event";
					const venue = data.venue || data.location || saved.venue || "";
					if (venue && venueEl && venueRow) {
						venueEl.textContent = venue;
						venueRow.hidden = false;
					}
				} catch (_) {
					if (eventEl && !eventEl.textContent) eventEl.textContent = saved.eventTitle || "Event";
				}
			}

			async function completePayment() {
				errEl.textContent = "";
				if (!eventId) {
					errEl.textContent = "Missing event. Go back and book again.";
					return;
				}
				const token = window.JodAuth && window.JodAuth.getToken ? window.JodAuth.getToken() : null;
				if (!token) {
					errEl.textContent = "Please log in to complete payment.";
					return;
				}
				btn.disabled = true;
				btn.textContent = "Processing…";
				try {
					const user = window.JodAuth.getUser ? window.JodAuth.getUser() : {};
					const res = await fetch(apiBase + "/api/bookings", {
						method: "POST",
						headers: {
							"Content-Type": "application/json",
							"Authorization": "Bearer " + token
						},
						body: JSON.stringify({
							event_id: eventId,
							ticket_type: ticket,
							quantity: qty,
							total_price: price,
							payment_mode: "UPI / Card",
							receiver_name: user.full_name || user.username || "",
							receiver_email: user.email || ""
						})
					});
					const data = await res.json().catch(() => ({}));
					if (!res.ok) throw new Error(data.detail || "Payment could not be completed.");
					try { sessionStorage.removeItem("jod_pending_ticket_bill"); } catch (_) {}
					const bookingId = data.booking_id;
					window.location.href = bookingId
						? ("ticket-details.html?id=" + encodeURIComponent(bookingId))
						: "orders.html";
				} catch (err) {
					errEl.textContent = err.message || "Payment failed. Try again.";
					btn.disabled = false;
					btn.textContent = "Payment";
				}
			}

			if (btn) btn.addEventListener("click", completePayment);
			loadEvent();
		})();
	</script>
</body>
</html>
