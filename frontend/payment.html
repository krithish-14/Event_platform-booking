<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta http-equiv="Cache-Control" content="no-store" />
	<title>Ticket Bill | JOD Events</title>
	<link rel="icon" type="image/png" href="images/JOD Logo.png" />
	<link rel="apple-touch-icon" href="images/JOD Logo.png" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
	<style>
		* { box-sizing: border-box; margin: 0; padding: 0; }
		body {
			font-family: 'Outfit', system-ui, sans-serif;
			background: #f8fafc;
			color: #0f172a;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 1.5rem;
		}
		.wrap { width: 100%; max-width: 480px; }
		h1 { font-size: 1.45rem; font-weight: 800; margin-bottom: 0.35rem; }
		.sub { color: #64748b; font-size: 0.92rem; line-height: 1.55; margin-bottom: 1.2rem; }
		.bill-card {
			background: #ffffff;
			border: 1px solid #e2e8f0;
			border-radius: 16px;
			box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
			padding: 1.15rem 1.2rem 0.55rem;
		}
		.bill-card h2 {
			margin: 0 0 0.75rem;
			font-size: 0.78rem;
			font-weight: 800;
			letter-spacing: 0.07em;
			text-transform: uppercase;
			color: #64748b;
		}
		.row {
			display: flex;
			justify-content: space-between;
			gap: 1rem;
			padding: 0.62rem 0;
			border-bottom: 1px solid #f1f5f9;
			font-size: 0.92rem;
		}
		.row:last-of-type { border-bottom: none; }
		.row span:first-child { color: #64748b; font-weight: 600; }
		.row span:last-child { font-weight: 700; text-align: right; }
		.row.is-total span:last-child { color: #d97706; font-weight: 800; }
		.status {
			display: inline-block;
			background: #fff7ed;
			color: #c2410c;
			border: 1px solid #fed7aa;
			font-size: 0.72rem;
			font-weight: 800;
			padding: 0.18rem 0.55rem;
			border-radius: 999px;
		}
		.status.is-ok {
			background: #ecfdf5;
			color: #047857;
			border-color: #a7f3d0;
		}
		.ok {
			color: #047857;
			font-size: 0.9rem;
			font-weight: 700;
			margin-top: 0.75rem;
			min-height: 1.1em;
		}
		.pay-btn {
			width: 100%;
			margin-top: 1.2rem;
			padding: 0.9rem;
			border: none;
			border-radius: 10px;
			background: #f59e0b;
			color: #111827;
			font-family: inherit;
			font-size: 1rem;
			font-weight: 800;
			cursor: pointer;
		}
		.pay-btn:disabled { opacity: 0.55; cursor: not-allowed; }
		.back {
			display: block;
			text-align: center;
			margin-top: 0.9rem;
			color: #64748b;
			font-size: 0.85rem;
			font-weight: 600;
			text-decoration: none;
		}
		.err { color: #b91c1c; font-size: 0.85rem; margin-top: 0.75rem; min-height: 1.1em; }
	</style>
</head>
<body>
	<div class="wrap">
		<h1>Ticket bill</h1>
		<p class="sub">Complete payment to finish your registration.</p>
		<div class="bill-card">
			<h2>Selected ticket</h2>
			<div class="row"><span>Event</span><span id="payEvent">Loading…</span></div>
			<div class="row" id="venueRow" hidden><span>Venue</span><span id="payVenue"></span></div>
			<div class="row"><span>Ticket</span><span id="payTicket">—</span></div>
			<div class="row"><span>Quantity</span><span id="payQty">1</span></div>
			<div class="row is-total"><span>Amount</span><span id="payAmount">—</span></div>
			<div class="row"><span>Status</span><span><span class="status" id="payStatus">Payment pending</span></span></div>
		</div>
		<button type="button" class="pay-btn" id="payBtn">Pay Now</button>
		<p class="ok" id="paySuccess"></p>
		<p class="err" id="payError"></p>
		<a class="back" id="payBack" href="index.html">Back to event</a>
	</div>

	<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
	<script src="js/health.js?v=1"></script>
	<script src="js/auth.js?v=23"></script>
	<script src="js/razorpay-checkout.js?v=1"></script>
	<script>
		(function () {
			const params = new URLSearchParams(window.location.search);
			let saved = {};
			try { saved = JSON.parse(sessionStorage.getItem("jod_pending_ticket_bill") || "{}") || {}; } catch (_) { saved = {}; }

			function prettyTicket(raw) {
				const value = String(raw || "").replace(/\+/g, " ").trim();
				if (!value) return "General Admission";
				try { return decodeURIComponent(value); } catch (_) { return value; }
			}

			const eventId = params.get("eventId") || saved.eventId || "";
			const ticket = prettyTicket(params.get("ticket") || saved.ticket || "General Admission");
			const price = Number(params.get("price") || saved.price || 0);
			const qty = Number(saved.quantity || params.get("qty") || 1) || 1;
			const apiBase = ((window.JodAuth && window.JodAuth.API_BASE) || (window.JodHealth && window.JodHealth.getApiBaseUrl && window.JodHealth.getApiBaseUrl()) || "http://127.0.0.1:8001").replace(/\/$/, "");

			const eventEl = document.getElementById("payEvent");
			const venueRow = document.getElementById("venueRow");
			const venueEl = document.getElementById("payVenue");
			const ticketEl = document.getElementById("payTicket");
			const qtyEl = document.getElementById("payQty");
			const amountEl = document.getElementById("payAmount");
			const backEl = document.getElementById("payBack");
			const btn = document.getElementById("payBtn");
			const errEl = document.getElementById("payError");
			const okEl = document.getElementById("paySuccess");
			const statusEl = document.getElementById("payStatus");

			if (ticketEl) ticketEl.textContent = ticket;
			if (qtyEl) qtyEl.textContent = String(qty);
			if (amountEl) amountEl.textContent = price > 0 ? ("₹" + price.toLocaleString("en-IN")) : "Free";
			if (eventEl && saved.eventTitle) eventEl.textContent = saved.eventTitle;
			if (saved.venue && venueEl && venueRow) {
				venueEl.textContent = saved.venue;
				venueRow.hidden = false;
			}
			if (eventId && backEl) backEl.href = "event-details.html?id=" + encodeURIComponent(eventId);

			function getToken() {
				let token = "";
				if (window.JodAuth && typeof window.JodAuth.getToken === "function") {
					token = window.JodAuth.getToken() || "";
				}
				if (!token) {
					token = localStorage.getItem("jod_access_token") || sessionStorage.getItem("jod_access_token") || "";
				}
				token = String(token || "").replace(/^Bearer\s+/i, "").replace(/^["']|["']$/g, "").trim();
				if (token === "null" || token === "undefined") return "";
				return token;
			}

			function currentReturnUrl() {
				const file = (window.location.pathname.split("/").pop() || "payment.html");
				return file + window.location.search + window.location.hash;
			}

			function redirectToLogin(message) {
				const returnUrl = currentReturnUrl();
				try { sessionStorage.setItem("jod_redirect_after_login", returnUrl); } catch (_) {}
				if (errEl) errEl.textContent = message || "Please log in to complete payment.";
				window.location.href = "login.html?redirect=" + encodeURIComponent(returnUrl);
			}

			function apiErrorMessage(data, fallback) {
				const detail = data && data.detail;
				let text = fallback || "Payment could not be completed.";
				if (typeof detail === "string") text = detail;
				else if (Array.isArray(detail) && detail.length) {
					text = detail.map((item) => (item && (item.msg || item.message)) || String(item)).join(" ");
				}
				if (/could not validate credentials|not authenticated|invalid token|expired/i.test(text)) {
					return "SESSION_EXPIRED";
				}
				return text;
			}

			async function authFetch(url, options) {
				const token = getToken();
				const headers = Object.assign({}, (options && options.headers) || {});
				if (token) headers.Authorization = "Bearer " + token;
				if (window.JodAuth && typeof window.JodAuth.fetchAuth === "function") {
					return window.JodAuth.fetchAuth(url, Object.assign({}, options || {}, { headers: headers }));
				}
				return fetch(url, Object.assign({}, options || {}, { headers: headers, redirect: "follow" }));
			}

			async function fetchRegistrationStatus() {
				const token = getToken();
				if (!token || !eventId) return { state: "new" };
				try {
					const res = await authFetch(apiBase + "/api/bookings/registration-status?event_id=" + encodeURIComponent(eventId), {
						cache: "no-store",
						headers: { Accept: "application/json" }
					});
					if (res.status === 401 || res.status === 403) return { state: "auth_required" };
					if (!res.ok) return { state: "new" };
					const data = await res.json();
					return data && data.state ? data : { state: "new" };
				} catch (_) {
					return { state: "new" };
				}
			}

			async function loadEvent() {
				if (!eventId) {
					if (eventEl && !saved.eventTitle) eventEl.textContent = "Event";
					return;
				}
				try {
					const res = await fetch(apiBase + "/api/events/public/" + encodeURIComponent(eventId));
					if (!res.ok) throw new Error("Event unavailable");
					const data = await res.json();
					if (eventEl) eventEl.textContent = data.title || saved.eventTitle || "Event";
					const venue = data.venue || data.location || saved.venue || "";
					if (venue && venueEl && venueRow) {
						venueEl.textContent = venue;
						venueRow.hidden = false;
					}
				} catch (_) {
					if (eventEl && !eventEl.textContent) eventEl.textContent = saved.eventTitle || "Event";
				}
			}

			function goToTicket(bookingId) {
				try { sessionStorage.removeItem("jod_pending_ticket_bill"); } catch (_) {}
				window.location.href = bookingId
					? ("ticket-details.html?id=" + encodeURIComponent(bookingId))
					: "orders.html";
			}

			async function completeFreeBooking(token, user) {
				const res = await fetch(apiBase + "/api/bookings", {
					method: "POST",
					headers: {
						"Content-Type": "application/json",
						"Authorization": "Bearer " + token
					},
					body: JSON.stringify({
						event_id: eventId,
						ticket_type: ticket,
						quantity: qty,
						total_price: 0,
						payment_mode: "Free",
						receiver_name: user.full_name || user.username || "",
						receiver_email: user.email || "",
						receiver_phone: user.phone || ""
					})
				});
				const data = await res.json().catch(() => ({}));
				if (!res.ok) throw new Error(data.detail || "Booking could not be completed.");
				if (okEl) okEl.textContent = "Ticket confirmed. No payment required.";
				if (statusEl) {
					statusEl.textContent = "Confirmed";
					statusEl.classList.add("is-ok");
				}
				goToTicket(data.booking_id);
			}

			async function completePayment() {
				if (errEl) errEl.textContent = "";
				if (okEl) okEl.textContent = "";
				if (!eventId) {
					errEl.textContent = "Missing event. Go back and book again.";
					return;
				}
				const token = getToken();
				if (!token) {
					redirectToLogin("Please log in to complete payment.");
					return;
				}
				const user = window.JodAuth.getUser ? (window.JodAuth.getUser() || {}) : {};
				btn.disabled = true;
				btn.textContent = "Processing…";
				try {
					const existing = await fetchRegistrationStatus();
					if (existing.state === "auth_required") {
						redirectToLogin("Your session expired. Please log in again to complete payment.");
						return;
					}
					if (existing.state === "ticket" && existing.booking_id) {
						try { sessionStorage.removeItem("jod_pending_ticket_bill"); } catch (_) {}
						window.location.replace("ticket-details.html?id=" + encodeURIComponent(existing.booking_id));
						return;
					}
					if (price <= 0) {
						await completeFreeBooking(token, user);
						return;
					}
					if (!window.JodRazorpay) throw new Error("Payment module failed to load.");
					const verified = await window.JodRazorpay.payForEvent({
						eventId: eventId,
						ticketType: ticket,
						quantity: qty,
						user: user
					});
					if (!verified || verified.status !== "Payment Verified") {
						throw new Error("Verification Failed");
					}
					if (okEl) okEl.textContent = "Payment Verified. Your ticket is confirmed.";
					if (statusEl) {
						statusEl.textContent = "Payment Verified";
						statusEl.classList.add("is-ok");
					}
					try {
						const key = window.JodAuth && typeof window.JodAuth.bookingsCacheKey === "function"
							? window.JodAuth.bookingsCacheKey()
							: null;
						if (key && verified) {
							const cache = JSON.parse(localStorage.getItem(key) || "[]");
							const next = Array.isArray(cache) ? cache : [];
							const idx = next.findIndex((row) => row && row.booking_id === verified.booking_id);
							if (idx >= 0) next[idx] = Object.assign({}, next[idx], verified);
							else next.unshift(verified);
							localStorage.setItem(key, JSON.stringify(next));
						}
					} catch (_) {}
					goToTicket(verified.booking_id);
				} catch (err) {
					const message = (err && err.message) || "Payment failed. Try again.";
					if (/cancel/i.test(message)) {
						btn.disabled = false;
						btn.textContent = "Pay Now";
						return;
					}
					if (/free or below/i.test(message)) {
						try {
							await completeFreeBooking(token, user);
							return;
						} catch (freeErr) {
							errEl.textContent = freeErr.message || message;
						}
					} else {
						errEl.textContent = message;
					}
					btn.disabled = false;
					btn.textContent = "Pay Now";
				}
			}

			if (btn) btn.addEventListener("click", completePayment);
			(async function bootPaymentPage() {
				if (!getToken()) {
					redirectToLogin("Please log in to complete payment.");
					return;
				}
				const status = await fetchRegistrationStatus();
				if (status.state === "auth_required") {
					redirectToLogin("Your session expired. Please log in again to complete payment.");
					return;
				}
				if (status.state === "ticket" && status.booking_id) {
					window.location.replace("ticket-details.html?id=" + encodeURIComponent(status.booking_id));
					return;
				}
				await loadEvent();
			})();
		})();
	</script>
</body>
</html>
