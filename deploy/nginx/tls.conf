# Optional HTTPS server. Mount certificates at /etc/nginx/certs/fullchain.pem
# and /etc/nginx/certs/privkey.pem, then copy this file over nginx.conf or
# include it from docker-compose.tls.yml.

limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=otp_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=30r/m;

upstream jod_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://accounts.google.com https://oauth2.googleapis.com; frame-src https://accounts.google.com; worker-src 'self' blob:" always;

    location = /health {
        proxy_pass http://jod_api/health;
        include /etc/nginx/proxy_params;
    }

    location = /health/ready {
        proxy_pass http://jod_api/health/ready;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        proxy_pass http://jod_api;
        include /etc/nginx/proxy_params;
    }

    location /uploads/ {
        proxy_pass http://jod_api;
        include /etc/nginx/proxy_params;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
