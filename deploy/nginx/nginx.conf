limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=otp_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=30r/m;

upstream jod_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 6m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;
    # Static MPA still uses inline scripts; CSP blocks foreign script hosts/plugins.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://accounts.google.com https://oauth2.googleapis.com; frame-src https://accounts.google.com; worker-src 'self' blob:" always;

    location = /health {
        proxy_pass http://jod_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location = /health/ready {
        proxy_pass http://jod_api/health/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location ^~ /api/auth/login {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://jod_api;
        include /etc/nginx/proxy_params;
    }

    location ^~ /api/auth/register {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://jod_api;
        include /etc/nginx/proxy_params;
    }

    location ^~ /api/auth/ {
        limit_req zone=otp_limit burst=8 nodelay;
        proxy_pass http://jod_api;
        include /etc/nginx/proxy_params;
    }

    location ^~ /api/admin/ {
        limit_req zone=admin_limit burst=20 nodelay;
        proxy_pass http://jod_api;
        include /etc/nginx/proxy_params;
    }

    location ^~ /api/payments/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://jod_api;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        proxy_pass http://jod_api;
        include /etc/nginx/proxy_params;
    }

    location /uploads/ {
        proxy_pass http://jod_api;
        include /etc/nginx/proxy_params;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
