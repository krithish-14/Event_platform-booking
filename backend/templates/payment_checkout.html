<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Pay Now | JOD Events</title>
	<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
	<style>
		body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
		.card { width: 100%; max-width: 420px; background: #111827; border: 1px solid #334155; border-radius: 16px; padding: 1.5rem; }
		h1 { margin: 0 0 0.5rem; font-size: 1.35rem; }
		p { color: #94a3b8; line-height: 1.5; }
		button { width: 100%; margin-top: 1rem; padding: 0.9rem; border: 0; border-radius: 10px; background: {{ theme_color }}; color: #111827; font-weight: 800; cursor: pointer; }
		button:disabled { opacity: 0.6; cursor: not-allowed; }
		.ok { color: #34d399; font-weight: 700; }
		.err { color: #f87171; }
	</style>
</head>
<body>
	<div class="card">
		<h1>Pay Now</h1>
		<p>Secure Razorpay checkout. The server verifies the payment signature before your ticket is confirmed.</p>
		<button type="button" id="payBtn">Pay Now</button>
		<p id="payMsg"></p>
	</div>
	<script>
		(function () {
			const API_BASE = {{ api_base | tojson }};
			const KEY_ID = {{ razorpay_key_id | tojson }};
			const THEME = {{ theme_color | tojson }};
			const params = new URLSearchParams(window.location.search);
			const btn = document.getElementById("payBtn");
			const msg = document.getElementById("payMsg");

			function token() {
				try { return localStorage.getItem("jod_access_token") || sessionStorage.getItem("jod_access_token"); }
				catch (_) { return null; }
			}
			function user() {
				try { return JSON.parse(localStorage.getItem("jod_user") || sessionStorage.getItem("jod_user") || "null"); }
				catch (_) { return null; }
			}

			btn.addEventListener("click", async function () {
				msg.textContent = "";
				msg.className = "";
				const auth = token();
				if (!auth) {
					msg.className = "err";
					msg.textContent = "Please log in first.";
					return;
				}
				const eventId = params.get("eventId") || params.get("event_id");
				if (!eventId) {
					msg.className = "err";
					msg.textContent = "Missing eventId in the URL.";
					return;
				}
				btn.disabled = true;
				btn.textContent = "Opening checkout…";
				try {
					const orderRes = await fetch(API_BASE + "/create_order/", {
						method: "POST",
						headers: { "Content-Type": "application/json", "Authorization": "Bearer " + auth },
						body: JSON.stringify({
							event_id: eventId,
							ticket_type: params.get("ticket") || "General Admission",
							quantity: Number(params.get("qty") || 1)
						})
					});
					const order = await orderRes.json();
					if (!orderRes.ok) throw new Error(order.detail || "Could not create order.");
					const u = user() || {};
					const rzp = new Razorpay({
						key: order.key || KEY_ID,
						amount: order.amount,
						currency: order.currency || "INR",
						name: "JOD Events",
						description: order.event_title || "Event ticket",
						order_id: order.order_id,
						prefill: {
							name: (order.prefill && order.prefill.name) || u.full_name || "",
							email: (order.prefill && order.prefill.email) || u.email || "",
							contact: (order.prefill && order.prefill.contact) || u.phone || ""
						},
						theme: { color: THEME },
						handler: async function (response) {
							const verifyRes = await fetch(API_BASE + "/verify_payment/", {
								method: "POST",
								headers: { "Content-Type": "application/json", "Authorization": "Bearer " + auth },
								body: JSON.stringify({
									order_id: response.razorpay_order_id,
									payment_id: response.razorpay_payment_id,
									signature: response.razorpay_signature
								})
							});
							const verified = await verifyRes.json();
							if (verified.status !== "Payment Verified") {
								msg.className = "err";
								msg.textContent = "Verification Failed";
								btn.disabled = false;
								btn.textContent = "Pay Now";
								return;
							}
							msg.className = "ok";
							msg.textContent = "Payment Verified. Your ticket is confirmed.";
							if (verified.booking_id) {
								window.location.href = "/ticket-details.html?id=" + encodeURIComponent(verified.booking_id);
							}
						}
					});
					rzp.open();
					btn.disabled = false;
					btn.textContent = "Pay Now";
				} catch (err) {
					msg.className = "err";
					msg.textContent = err.message || "Payment failed.";
					btn.disabled = false;
					btn.textContent = "Pay Now";
				}
			});
		})();
	</script>
</body>
</html>
